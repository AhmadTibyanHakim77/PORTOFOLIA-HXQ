<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e2640" />
      <stop offset="60%" stop-color="#11131b" />
      <stop offset="100%" stop-color="#08090d" />
    </radialGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d7cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8baaff" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="24" />
  <circle cx="200" cy="150" r="60" fill="url(#accentGlow)" />
  <circle cx="200" cy="150" r="52" fill="#11131b" />
  <text x="200" y="160" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="2">ATH</text>
  <path d="M110 320 C110 240, 290 240, 290 320" fill="url(#accentGlow)" opacity="0.35" />
  <path d="M120 320 C120 250, 280 250, 280 320" fill="#11131b" />
  <!-- subtle frame -->
  <rect x="12" y="12" width="376" height="376" rx="16" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" />
  <text x="200" y="360" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#9295a3" text-anchor="middle" letter-spacing="3">AHMAD TIBYAN HAKIM</text>
</svg>

