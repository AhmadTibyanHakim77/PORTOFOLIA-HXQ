<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_studymate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19152b" />
      <stop offset="100%" stop-color="#0a0812" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_studymate)" rx="16"/>
  <rect x="70" y="60" width="660" height="380" rx="12" fill="#110e1c" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="100" cy="85" r="5" fill="#ef4444" opacity="0.7"/>
  <circle cx="120" cy="85" r="5" fill="#eab308" opacity="0.7"/>
  <circle cx="140" cy="85" r="5" fill="#22c55e" opacity="0.7"/>
  <line x1="70" y1="110" x2="730" y2="110" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- AI Chat Bubble 1 (User) -->
  <rect x="360" y="140" width="340" height="60" rx="12" fill="#241d3d" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="385" y="175" font-family="system-ui, sans-serif" font-size="13" fill="#f5f5f7">Jelaskan cara kerja backpropagation pada neural network?</text>
  <!-- AI Chat Bubble 2 (AI Response) -->
  <rect x="100" y="215" width="460" height="110" rx="12" fill="#171326" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="125" cy="245" r="12" fill="#8b5cf6" opacity="0.3"/>
  <text x="125" y="249" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">AI</text>
  <text x="150" y="248" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">StudyMate AI Assistant</text>
  <text x="125" y="278" font-family="system-ui, sans-serif" font-size="12" fill="#c9ccd6">Backpropagation menghitung gradien fungsi loss terhadap setiap bobot...</text>
  <text x="125" y="302" font-family="system-ui, sans-serif" font-size="12" fill="#9295a3">Melalui aturan rantai (chain rule) dari output layer menuju input layer.</text>
  <!-- Interactive Prompt Input -->
  <rect x="100" y="340" width="600" height="55" rx="10" fill="#1a152e" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="130" y="373" font-family="system-ui, sans-serif" font-size="13" fill="#9295a3">Tanyakan konsep akademis atau minta dibuatkan rangkuman...</text>
  <rect x="635" y="350" width="50" height="35" rx="6" fill="#8b5cf6"/>
  <text x="660" y="372" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">→</text>
  <text x="700" y="460" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="end" opacity="0.8">STUDYMATE AI · ACADEMIC COMPANION</text>
</svg>

